<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="250" viewBox="0 0 1440 250" role="img" aria-labelledby="t d"><title id="t">From recording to replay</title><desc id="d">Import a video, analyze locally, review exact frames, then export the replay and data.</desc><rect width="1440" height="250" rx="24" fill="#F6F5ED"/><g font-family="Arial,Helvetica,sans-serif" fill="#173F35"><rect x="30" y="45" width="300" height="160" rx="20" fill="white" stroke="#D8DFD2"/><circle cx="68" cy="85" r="19" fill="#D5E84C"/><text x="63" y="91" font-size="17" font-weight="700">1</text><text x="54" y="138" font-size="25" font-weight="700">Import</text><text x="54" y="175" font-size="16">Choose a full-court recording</text><text x="346" y="134" font-size="28">→</text><rect x="390" y="45" width="300" height="160" rx="20" fill="white" stroke="#D8DFD2"/><circle cx="428" cy="85" r="19" fill="#D5E84C"/><text x="423" y="91" font-size="17" font-weight="700">2</text><text x="414" y="138" font-size="25" font-weight="700">Analyze locally</text><text x="414" y="175" font-size="16">Track players and ball on-device</text><text x="706" y="134" font-size="28">→</text><rect x="750" y="45" width="300" height="160" rx="20" fill="white" stroke="#D8DFD2"/><circle cx="788" cy="85" r="19" fill="#D5E84C"/><text x="783" y="91" font-size="17" font-weight="700">3</text><text x="774" y="138" font-size="25" font-weight="700">Review</text><text x="774" y="175" font-size="16">Inspect frames and correct labels</text><text x="1066" y="134" font-size="28">→</text><rect x="1110" y="45" width="300" height="160" rx="20" fill="white" stroke="#D8DFD2"/><circle cx="1148" cy="85" r="19" fill="#D5E84C"/><text x="1143" y="91" font-size="17" font-weight="700">4</text><text x="1134" y="138" font-size="25" font-weight="700">Keep the replay</text><text x="1134" y="175" font-size="16">Export video and structured data</text></g></svg>