name: Feature request
description: Suggest an improvement for tennis players or developers.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Player or developer need
      description: What problem would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version and how success could be measured.
    validations:
      required: true
  - type: dropdown
    id: footage
    attributes:
      label: Primary footage
      options:
        - Phone singles
        - Phone doubles
        - Broadcast singles
        - Broadcast doubles
        - Not footage-specific
    validations:
      required: true
