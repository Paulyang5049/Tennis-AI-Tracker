name: TennisOffline
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '26.0'
packages:
  TennisCore:
    path: .
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  TennisOffline:
    type: application
    platform: iOS
    sources:
      - path: TennisApp
        excludes:
          - Resources
      - path: TennisApp/Resources
        excludes:
          - Models/Detector.mlpackage
        buildPhase: resources
      - path: TennisApp/Resources/Models/Detector.mlpackage
        optional: true
        buildPhase: sources
    dependencies:
      - package: TennisCore
        product: TennisCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tennisoffline
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 网球复盘
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
schemes:
  TennisOffline:
    build:
      targets:
        TennisOffline: all
