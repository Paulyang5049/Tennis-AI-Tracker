[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-ai-local"
version = "0.1.0"
description = "Local YOLO26 tennis replay and Colab training"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "Yunbo (Paul) Yang" }]
keywords = ["tennis", "computer-vision", "yolo26", "sports-analytics", "tracking"]
requires-python = ">=3.11,<3.13"
dependencies = [
  "ultralytics==8.4.140", "gradio==6.26.0", "av==18.1.0",
  "gdown==5.2.0", "numpy==2.4.6", "opencv-python==5.0.0.93", "torch==2.14.0",
  "torchvision==0.29.0", "lap==0.5.12"
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1"]
[project.scripts]
tennis-ai = "tennis_ai.cli:main"

[project.urls]
Homepage = "https://github.com/Paulyang5049/tennis-ai-local"
Repository = "https://github.com/Paulyang5049/tennis-ai-local"
Issues = "https://github.com/Paulyang5049/tennis-ai-local/issues"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/tennis_ai"]
[tool.pytest.ini_options]
testpaths = ["tests"]
